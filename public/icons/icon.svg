<!-- The app's mark: a page of the calendar with its two rings and a record on
     it, on the ink tile of the light palette (#211f1a), the page in its paper
     (#efe9dd), the header and the record in its accent (#b0532f). The rounded
     tile is the browser's version (the tab, the manifest's "any" icons);
     icon-apple.svg and icon-maskable.svg are the full-bleed twins. The PNGs
     are made by scripts/gen-icons.mjs. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
<rect width="64" height="64" rx="14" fill="#211f1a"/>
<rect x="5" y="8.78" width="54" height="46.44" rx="6.48" fill="#efe9dd"/>
<path d="M5 15.26a6.48 6.48 0 0 1 6.48-6.48h41.04a6.48 6.48 0 0 1 6.48 6.48v4.6656h-54z" fill="#b0532f"/>
<rect x="19.58" y="5.9936" width="3.24" height="7.4304" rx="1.62" fill="#211f1a"/>
<rect x="41.18" y="5.9936" width="3.24" height="7.4304" rx="1.62" fill="#211f1a"/>
<circle cx="32" cy="37.5728" r="9.288" fill="#b0532f"/>
<circle cx="32" cy="37.5728" r="2.7864" fill="#efe9dd"/>

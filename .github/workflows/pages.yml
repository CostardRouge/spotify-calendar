name: Showcase (GitHub Pages)

# Builds the app in demo mode (DEMO_MODE=1 — fixture library, no Spotify
# credentials), captures real screenshots of the running UI with Playwright,
# assembles the showcase landing page and deploys it to GitHub Pages.
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Start app in demo mode
        run: |
          DEMO_MODE=1 nohup npx next start -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:3000/api/health && break
            sleep 1
          done
          curl -fs http://127.0.0.1:3000/api/health

      - name: Capture screenshots
        run: node scripts/showcase-screenshots.mjs site/screenshots
        env:
          BASE_URL: http://127.0.0.1:3000

      # The page's icons are the app's own set (public/icons, C11), copied
      # whole so the showcase's head links resolve under /spotify-calendar/.
      # llms.txt (C17) is served at the showcase's root, linked from nothing.
      - name: Assemble site
        run: |
          cp showcase/index.html site/
          cp showcase/llms.txt site/
          cp public/og-image.png site/
          cp -r public/icons site/icons

      - name: Show server log (debug aid)
        if: always()
        run: tail -50 /tmp/next.log || true

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

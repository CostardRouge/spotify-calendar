<!-- Full bleed for Android's adaptive launcher masks. The drawing is icon.svg's
     at 85 %, centred, so it stays inside the safe zone (the centred circle of
     80 % diameter, radius 25.6 from (32, 32)): the record's rim, at radius 26,
     comes to 22.1. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
<rect width="64" height="64" fill="#15110e"/>
<g transform="translate(4.8 4.8) scale(0.85)">
<circle cx="32" cy="32" r="26" fill="#0d0a08"/>
<circle cx="32" cy="32" r="22.5" fill="none" stroke="#3a2f27" stroke-width="0.9"/>
<circle cx="32" cy="32" r="19" fill="none" stroke="#3a2f27" stroke-width="0.9"/>
<circle cx="32" cy="32" r="15.5" fill="none" stroke="#3a2f27" stroke-width="0.9"/>
<circle cx="32" cy="32" r="10" fill="#ff6a3d"/>
<circle cx="32" cy="32" r="2" fill="#15110e"/>
</g>
</svg>

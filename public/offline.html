<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f1ea" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#15110e" />
<title>Cannot reach Sillon</title>
<!--
  Served by public/sw.js when a page load gets no response at all. Self-contained on purpose: when this
  shows, nothing else from the server can be fetched — no stylesheet, no icon. The colours and type are
  app/globals.css's tokens, copied. It says what is known and nothing more: the library saved on this
  device is still there, the server could not be reached from here.
  Changing this file means bumping VERSION in public/sw.js.
-->
<style>
  :root {
    --bg: #15110e; --panel: #1c1612; --line: #2e2620; --text: #f4ece2; --muted: #b9ab99;
    --accent: #ff6a3d; --on-accent: #15110e; --record: #0d0a08;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color-scheme: dark light;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f1ea; --panel: #fffaf3; --line: #e3d9cb; --text: #1a1511; --muted: #6b6157;
      --accent: #c2410c; --on-accent: #ffffff; --record: #1a1511;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
    padding: max(1.5rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right))
      max(1.5rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
    background: var(--bg); color: var(--text); font: 15px/1.6 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%; max-width: 420px; padding: 30px 28px;
    background: var(--panel); border-radius: 26px;
  }
  .tag {
    display: inline-flex; align-items: center; gap: 10px;
    font: 600 11px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
  }
  /* The app's mark, a small record with its orange label (app/globals.css .mark). */
  .dot {
    width: 26px; height: 26px; border-radius: 50%;
    background: radial-gradient(circle, var(--record) 0 9%, var(--accent) 10% 36%, var(--record) 37%);
    box-shadow: 0 0 0 1px var(--line);
  }
  h1 { margin: 16px 0 8px; font: 800 26px/1.15 var(--sans); letter-spacing: -.03em; }
  p { margin: 0 0 12px; color: var(--muted); }
  button {
    margin-top: 8px; width: 100%; min-height: 44px; padding: 11px 14px;
    background: var(--accent); color: var(--on-accent); border: none; border-radius: 999px;
    font: 600 15px var(--sans); cursor: pointer;
  }
  button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <span class="tag"><span class="dot" aria-hidden="true"></span>Offline</span>
  <h1>Cannot reach Sillon</h1>
  <p>This device got no answer from the server: no network, off the home network or VPN, or the server itself is down.</p>
  <p>Nothing is lost. Your library stays saved on this device, and the calendar opens again as soon as the server answers.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
